<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIR Intelligence &amp; Crime Pattern Detector</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-is@18/umd/react-is.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.15.3/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--bg2:#0f1629;--card:#151d35;--card2:#1c2748;--border:#243058;--text:#edf2ff;--text2:#8b9dc3;--blue:#4f8ff7;--blue2:#2563eb;--red:#f43f5e;--green:#10b981;--amber:#f59e0b;--purple:#a78bfa;--cyan:#22d3ee;--pink:#f472b6;--orange:#fb923c}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.glass{background:var(--card);border:1px solid var(--border);border-radius:12px;transition:border-color .2s,box-shadow .2s}
.glass:hover{border-color:rgba(79,143,247,.3);box-shadow:0 0 24px rgba(79,143,247,.06)}
.glow{box-shadow:0 4px 24px rgba(0,0,0,.3),0 0 0 1px var(--border)}
.fade-in{animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.badge-critical{background:rgba(244,63,94,.15);color:#f43f5e;border:1px solid rgba(244,63,94,.3)}
.badge-high{background:rgba(251,146,60,.15);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
.badge-medium{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
.badge-low{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
.btn{padding:8px 20px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--blue2);color:white}.btn-primary:hover{background:#3b82f6;box-shadow:0 0 20px rgba(37,99,235,.4)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--card2);color:var(--text)}
input,select{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;font-size:14px;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--blue)}
.p-5{padding:20px}
.tab{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.tab-active{background:var(--blue2);color:white;box-shadow:0 2px 12px rgba(37,99,235,.35)}
.tab-inactive{background:transparent;color:var(--text2)}.tab-inactive:hover{background:var(--card2);color:var(--text)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo} = React;
const {PieChart,Pie,Cell,BarChart,Bar,LineChart,Line,AreaChart,Area,XAxis,YAxis,CartesianGrid,Tooltip,Legend,ResponsiveContainer,RadarChart,Radar,PolarGrid,PolarAngleAxis,PolarRadiusAxis,Treemap} = Recharts;

const API = '/api';
const COLORS = ['#4f8ff7','#f43f5e','#10b981','#f59e0b','#a78bfa','#22d3ee','#f472b6','#fb923c','#14b8a6','#6366f1','#818cf8','#e11d48','#84cc16','#0ea5e9','#d946ef'];
const RISK_BG = {critical:'rgba(244,63,94,.08)',high:'rgba(251,146,60,.08)',medium:'rgba(245,158,11,.08)',low:'rgba(16,185,129,.08)'};
const RISK_COLOR = {critical:'#f43f5e',high:'#fb923c',medium:'#f59e0b',low:'#10b981'};

async function api(path){try{const r=await fetch(API+path);return r.json();}catch(e){return null;}}

const ChartTooltip = {contentStyle:{background:'#151d35',border:'1px solid #243058',borderRadius:'10px',color:'#edf2ff',fontSize:'13px',boxShadow:'0 8px 24px rgba(0,0,0,.4)'},itemStyle:{color:'#8b9dc3'}};

function StatCard({label,value,sub,color,icon}){
  return <div className="glass p-5 fade-in">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
      <div>
        <p style={{color:'var(--text2)',fontSize:'13px',fontWeight:500,marginBottom:6}}>{label}</p>
        <p style={{fontSize:'32px',fontWeight:700,color,lineHeight:1}}>{value}</p>
        {sub && <p style={{fontSize:'12px',color:'var(--text2)',marginTop:4}}>{sub}</p>}
      </div>
      <div style={{width:42,height:42,borderRadius:10,background:color+'15',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20}}>{icon}</div>
    </div>
  </div>;
}

function Loading(){return <div style={{display:'flex',justifyContent:'center',padding:'80px 0'}}><div className="spinner" style={{width:40,height:40}}></div></div>}

// ── DASHBOARD ──
function Dashboard({data}){
  if(!data) return <Loading/>;
  const crimeData = Object.entries(data.crime_breakdown||{}).map(([name,value])=>({name:name.replace('_',' '),value})).sort((a,b)=>b.value-a.value);
  const districtData = Object.entries(data.district_breakdown||{}).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
  const trendData = Object.entries(data.monthly_trend||{}).map(([name,value])=>({name,value}));
  const sev = data.severity_distribution||{};
  const totalSev = Object.values(sev).reduce((a,b)=>a+b,0)||1;
  return <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:24}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:16}}>
      <StatCard label="Total FIRs Analyzed" value={data.total_firs} color="var(--blue)" icon="📋" sub="across 7 districts"/>
      <StatCard label="Accused Identified" value={data.total_accused} color="var(--red)" icon="👤" sub="via NLP extraction"/>
      <StatCard label="Victims Recorded" value={data.total_victims} color="var(--amber)" icon="🛡" sub="complainants + victims"/>
      <StatCard label="Repeat Offenders" value={data.repeat_offenders_count} color="var(--purple)" icon="🔁" sub="fuzzy match 78%+ threshold"/>
    </div>

    {/* Severity bar */}
    <div className="glass p-5">
      <h3 style={{fontSize:15,fontWeight:600,marginBottom:12}}>Severity Distribution</h3>
      <div style={{display:'flex',borderRadius:8,overflow:'hidden',height:28}}>
        {['critical','high','medium','low'].map(level=>{
          const pct = ((sev[level]||0)/totalSev*100);
          return pct>0 ? <div key={level} style={{width:pct+'%',background:RISK_COLOR[level],display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:600,color:'#fff',minWidth:pct>5?'auto':0}} title={`${level}: ${sev[level]}`}>{pct>8?`${level.toUpperCase()} ${sev[level]}`:''}</div> : null;
        })}
      </div>
      <div style={{display:'flex',gap:20,marginTop:10}}>
        {['critical','high','medium','low'].map(l=><div key={l} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--text2)'}}>
          <div style={{width:10,height:10,borderRadius:3,background:RISK_COLOR[l]}}></div>{l}: {sev[l]||0}
        </div>)}
      </div>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <div className="glass p-5">
        <h3 style={{fontSize:15,fontWeight:600,marginBottom:16}}>Crime Type Distribution</h3>
        <ResponsiveContainer width="100%" height={280}>
          <PieChart><Pie data={crimeData} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={95} innerRadius={55} paddingAngle={2} label={({name,percent})=>percent>.05?`${name} ${(percent*100).toFixed(0)}%`:''} labelLine={{stroke:'#4f8ff7',strokeWidth:1}}>
            {crimeData.map((_,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}
          </Pie><Tooltip {...ChartTooltip}/></PieChart>
        </ResponsiveContainer>
      </div>
      <div className="glass p-5">
        <h3 style={{fontSize:15,fontWeight:600,marginBottom:16}}>FIRs by District</h3>
        <ResponsiveContainer width="100%" height={280}>
          <BarChart data={districtData}><CartesianGrid strokeDasharray="3 3" stroke="#1c2748"/><XAxis dataKey="name" stroke="#8b9dc3" tick={{fontSize:12}}/><YAxis stroke="#8b9dc3"/><Tooltip {...ChartTooltip}/>
            <Bar dataKey="value" radius={[6,6,0,0]}>{districtData.map((_,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}</Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
    </div>

    <div className="glass p-5">
      <h3 style={{fontSize:15,fontWeight:600,marginBottom:16}}>Monthly Crime Trend</h3>
      <ResponsiveContainer width="100%" height={240}>
        <AreaChart data={trendData}><defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#4f8ff7" stopOpacity={.3}/><stop offset="95%" stopColor="#4f8ff7" stopOpacity={0}/></linearGradient></defs>
          <CartesianGrid strokeDasharray="3 3" stroke="#1c2748"/><XAxis dataKey="name" stroke="#8b9dc3" tick={{fontSize:12}}/><YAxis stroke="#8b9dc3"/><Tooltip {...ChartTooltip}/>
          <Area type="monotone" dataKey="value" stroke="#4f8ff7" fill="url(#trendGrad)" strokeWidth={2.5}/>
        </AreaChart>
      </ResponsiveContainer>
    </div>

    <div className="glass p-5">
      <h3 style={{fontSize:15,fontWeight:600,marginBottom:16}}>Crime Networks Detected</h3>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14}}>
        {(data.crime_networks||[]).map((net,i)=><div key={i} style={{padding:16,borderRadius:10,background:'rgba(79,143,247,.06)',border:'1px solid rgba(79,143,247,.15)'}}>
          <h4 style={{color:'var(--blue)',fontWeight:600,fontSize:14}}>{net.name}</h4>
          <p style={{fontSize:12,color:'var(--text2)',marginTop:6}}>{net.fir_count} linked FIRs across {net.districts.join(', ')}</p>
          <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:8}}>{net.crime_types.map((ct,j)=><span key={j} style={{padding:'2px 8px',borderRadius:12,fontSize:10,background:'rgba(79,143,247,.12)',color:'var(--blue)'}}>{ct}</span>)}</div>
        </div>)}
      </div>
    </div>
  </div>;
}

// ── FIR LIST ──
function FIRList(){
  const [firs,setFirs]=useState([]);const [filter,setFilter]=useState('');const [typeFilter,setTypeFilter]=useState('');const [expanded,setExpanded]=useState(null);
  useEffect(()=>{api('/firs').then(d=>d&&setFirs(d));},[]);
  const types=[...new Set(firs.map(f=>f.crime_type))].sort();
  const filtered=firs.filter(f=>{
    if(typeFilter&&f.crime_type!==typeFilter) return false;
    if(!filter) return true;
    const q=filter.toLowerCase();
    return f.fir_number.toLowerCase().includes(q)||f.district.toLowerCase().includes(q)||(f.entities?.accused||[]).some(a=>a.name.toLowerCase().includes(q))||f.text?.toLowerCase().includes(q);
  });
  return <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
      <input type="text" placeholder="Search FIR #, accused, keywords..." style={{flex:1,minWidth:280}} value={filter} onChange={e=>setFilter(e.target.value)}/>
      <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
        <option value="">All Crime Types</option>
        {types.map(t=><option key={t} value={t}>{t.replace('_',' ')}</option>)}
      </select>
      <span style={{color:'var(--text2)',fontSize:13,alignSelf:'center'}}>{filtered.length} of {firs.length} records</span>
    </div>
    {filtered.map(fir=><div key={fir.fir_number} className="glass" style={{padding:16,cursor:'pointer'}} onClick={()=>setExpanded(expanded===fir.fir_number?null:fir.fir_number)}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontFamily:'monospace',color:'var(--blue)',fontWeight:600}}>{fir.fir_number}</span>
          <span className={`badge badge-${fir.severity||'medium'}`}>{(fir.severity||'medium').toUpperCase()}</span>
          <span style={{padding:'2px 8px',borderRadius:12,fontSize:11,background:'var(--card2)',color:'var(--text2)'}}>{fir.crime_type?.replace('_',' ')}</span>
        </div>
        <span style={{fontSize:13,color:'var(--text2)'}}>{fir.date} | {fir.district} | {fir.police_station}</span>
      </div>
      <p style={{marginTop:8,fontSize:13,color:'var(--text2)',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{fir.text?.substring(0,250)}...</p>
      {expanded===fir.fir_number&&fir.entities&&<div className="fade-in" style={{marginTop:16,paddingTop:16,borderTop:'1px solid var(--border)',display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(250px,1fr))',gap:16}}>
        <div><h4 style={{fontSize:13,fontWeight:600,color:'var(--red)',marginBottom:8}}>Accused ({(fir.entities.accused||[]).length})</h4>
          {(fir.entities.accused||[]).map((a,i)=><div key={i} style={{marginBottom:8,padding:10,borderRadius:8,background:'var(--bg2)',fontSize:13}}>
            <p style={{fontWeight:600}}>{a.name}</p>
            {a.aliases?.length>0&&<p style={{fontSize:11,color:'var(--text2)'}}>AKA: {a.aliases.join(', ')}</p>}
            {a.age&&<p style={{fontSize:11,color:'var(--text2)'}}>Age: {a.age}{a.gender?` | ${a.gender}`:''}</p>}
            {a.address&&<p style={{fontSize:11,color:'var(--text2)'}}>Addr: {a.address}</p>}
          </div>)}
        </div>
        <div><h4 style={{fontSize:13,fontWeight:600,color:'var(--green)',marginBottom:8}}>Victims ({(fir.entities.victims||[]).length})</h4>
          {(fir.entities.victims||[]).map((v,i)=><div key={i} style={{marginBottom:8,padding:10,borderRadius:8,background:'var(--bg2)',fontSize:13}}>
            <p style={{fontWeight:600}}>{v.name}</p>
            {v.age&&<p style={{fontSize:11,color:'var(--text2)'}}>Age: {v.age}{v.gender?` | ${v.gender}`:''}</p>}
          </div>)}
          {fir.entities.modus_operandi&&<div style={{marginTop:12}}>
            <h4 style={{fontSize:13,fontWeight:600,color:'var(--amber)',marginBottom:4}}>Modus Operandi</h4>
            <p style={{fontSize:12,color:'var(--text2)'}}>{typeof fir.entities.modus_operandi==='object'?(fir.entities.modus_operandi.description||fir.entities.modus_operandi.approach_method||JSON.stringify(fir.entities.modus_operandi)):fir.entities.modus_operandi}</p>
          </div>}
        </div>
        {fir.entities.ipc_sections?.length>0&&<div>
          <h4 style={{fontSize:13,fontWeight:600,color:'var(--purple)',marginBottom:8}}>IPC/Act Sections</h4>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{fir.entities.ipc_sections.map((s,i)=><span key={i} style={{padding:'3px 10px',borderRadius:12,fontSize:11,background:'rgba(167,139,250,.12)',color:'var(--purple)'}}>{s}</span>)}</div>
        </div>}
      </div>}
    </div>)}
  </div>;
}

// ── REPEAT OFFENDERS ──
function RepeatOffenders(){
  const [offenders,setOffenders]=useState([]);
  useEffect(()=>{api('/repeat-offenders').then(d=>d&&setOffenders(d));},[]);
  if(!offenders.length) return <Loading/>;
  return <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <div><h2 style={{fontSize:20,fontWeight:700}}>Flagged Repeat Offenders</h2>
        <p style={{fontSize:13,color:'var(--text2)',marginTop:4}}>Cross-FIR pattern matching (RapidFuzz 78%+ threshold) identified {offenders.length} repeat offenders</p>
      </div>
    </div>
    {offenders.map((off,i)=><div key={i} className="glass p-5 glow fade-in">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><h3 style={{fontSize:18,fontWeight:700,color:'var(--red)'}}>{off.primary_name}</h3>
          {off.aliases?.length>0&&<p style={{fontSize:13,color:'var(--text2)',marginTop:2}}>Aliases: {off.aliases.join(', ')}</p>}
        </div>
        <span className={`badge badge-${(off.risk_level||'medium').toLowerCase()}`} style={{fontSize:12,padding:'4px 14px'}}>{(off.risk_level||'MEDIUM').toUpperCase()}</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:10,marginTop:14}}>
        <div style={{padding:10,borderRadius:8,background:'var(--bg2)',textAlign:'center'}}><p style={{fontSize:11,color:'var(--text2)'}}>Linked FIRs</p><p style={{fontWeight:700,fontSize:20,color:'var(--blue)'}}>{off.fir_count||off.linked_firs?.length||0}</p></div>
        <div style={{padding:10,borderRadius:8,background:'var(--bg2)',textAlign:'center'}}><p style={{fontSize:11,color:'var(--text2)'}}>Districts</p><p style={{fontWeight:600,fontSize:13}}>{(off.districts||[]).join(', ')}</p></div>
        <div style={{padding:10,borderRadius:8,background:'var(--bg2)',textAlign:'center'}}><p style={{fontSize:11,color:'var(--text2)'}}>Crime Types</p><p style={{fontWeight:600,fontSize:13}}>{(off.crime_types||[]).join(', ')}</p></div>
        <div style={{padding:10,borderRadius:8,background:'var(--bg2)',textAlign:'center'}}><p style={{fontSize:11,color:'var(--text2)'}}>Confidence</p><p style={{fontWeight:700,fontSize:20,color:'var(--green)'}}>{off.match_confidence?`${(off.match_confidence*100).toFixed(0)}%`:'N/A'}</p></div>
      </div>
      {off.linked_firs&&<div style={{marginTop:12}}>
        <p style={{fontSize:11,color:'var(--text2)',marginBottom:6}}>Linked FIR Numbers</p>
        <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{off.linked_firs.map((f,j)=><span key={j} style={{padding:'3px 10px',borderRadius:12,fontSize:11,fontFamily:'monospace',background:'rgba(79,143,247,.1)',color:'var(--blue)',border:'1px solid rgba(79,143,247,.2)'}}>{f}</span>)}</div>
      </div>}
      {off.mo_signature&&<p style={{marginTop:10,fontSize:13,color:'var(--text2)'}}><strong style={{color:'var(--amber)'}}>MO Signature:</strong> {off.mo_signature}</p>}
      {off.intelligence_assessment&&<p style={{marginTop:6,fontSize:13,color:'var(--text2)',padding:10,borderRadius:8,background:'var(--bg2)',borderLeft:'3px solid var(--cyan)'}}>{off.intelligence_assessment}</p>}
    </div>)}
  </div>;
}

// ── CRIME TRENDS ──
function CrimeTrends({data}){
  if(!data) return <Loading/>;
  const trendData=Object.entries(data.monthly_trend||{}).map(([name,value])=>({name,value}));
  const crimeRanking=Object.entries(data.crime_breakdown||{}).sort((a,b)=>b[1]-a[1]);
  const maxCrime=crimeRanking.length>0?crimeRanking[0][1]:1;
  const radarData=crimeRanking.slice(0,8).map(([type,count])=>({subject:type.replace('_',' '),A:count}));
  return <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:20}}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
      <div className="glass p-5">
        <h3 style={{fontSize:15,fontWeight:600,marginBottom:16}}>Crime Trend Over Time</h3>
        <ResponsiveContainer width="100%" height={280}>
          <AreaChart data={trendData}><defs><linearGradient id="tg2" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#4f8ff7" stopOpacity={.35}/><stop offset="95%" stopColor="#4f8ff7" stopOpacity={0}/></linearGradient></defs>
            <CartesianGrid strokeDasharray="3 3" stroke="#1c2748"/><XAxis dataKey="name" stroke="#8b9dc3"/><YAxis stroke="#8b9dc3"/><Tooltip {...ChartTooltip}/>
            <Area type="monotone" dataKey="value" stroke="#4f8ff7" fill="url(#tg2)" strokeWidth={2.5}/>
          </AreaChart>
        </ResponsiveContainer>
      </div>
      <div className="glass p-5">
        <h3 style={{fontSize:15,fontWeight:600,marginBottom:16}}>Crime Radar Profile</h3>
        <ResponsiveContainer width="100%" height={280}>
          <RadarChart data={radarData}><PolarGrid stroke="#1c2748"/><PolarAngleAxis dataKey="subject" stroke="#8b9dc3" tick={{fontSize:11}}/><PolarRadiusAxis stroke="#1c2748"/>
            <Radar name="Crimes" dataKey="A" stroke="#4f8ff7" fill="rgba(79,143,247,.25)" strokeWidth={2}/>
          </RadarChart>
        </ResponsiveContainer>
      </div>
    </div>
    <div className="glass p-5">
      <h3 style={{fontSize:15,fontWeight:600,marginBottom:16}}>Crime Type Ranking</h3>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {crimeRanking.map(([type,count],i)=><div key={type} style={{display:'flex',alignItems:'center',gap:12}}>
          <span style={{width:28,textAlign:'center',fontSize:14,fontWeight:700,color:COLORS[i%COLORS.length]}}>#{i+1}</span>
          <span style={{width:120,fontSize:13,textTransform:'capitalize'}}>{type.replace('_',' ')}</span>
          <div style={{flex:1,background:'var(--bg2)',borderRadius:20,height:26,overflow:'hidden'}}>
            <div style={{height:'100%',borderRadius:20,display:'flex',alignItems:'center',paddingLeft:10,fontSize:12,fontWeight:600,color:'white',transition:'width .8s',width:`${(count/maxCrime)*100}%`,background:`linear-gradient(90deg,${COLORS[i%COLORS.length]},${COLORS[i%COLORS.length]}88)`}}>{count} FIRs</div>
          </div>
        </div>)}
      </div>
    </div>
    <div className="glass p-5">
      <h3 style={{fontSize:15,fontWeight:600,marginBottom:16}}>District Crime Comparison</h3>
      <ResponsiveContainer width="100%" height={280}>
        <BarChart data={Object.entries(data.district_breakdown||{}).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value)}>
          <CartesianGrid strokeDasharray="3 3" stroke="#1c2748"/><XAxis dataKey="name" stroke="#8b9dc3"/><YAxis stroke="#8b9dc3"/><Tooltip {...ChartTooltip}/>
          <Bar dataKey="value" radius={[6,6,0,0]}>{Object.entries(data.district_breakdown||{}).sort((a,b)=>b[1]-a[1]).map((_,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}</Bar>
        </BarChart>
      </ResponsiveContainer>
    </div>
  </div>;
}

// ── STATION SUMMARY ──
function StationSummary(){
  const [stations,setStations]=useState([]);
  useEffect(()=>{api('/stations').then(d=>d&&setStations(d));},[]);
  if(!stations.length) return <Loading/>;
  return <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:16}}>
    <h2 style={{fontSize:20,fontWeight:700}}>Station-Level Analysis</h2>
    {stations.map((st,i)=><div key={i} className="glass p-5">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}}>
        <div><h3 style={{fontSize:16,fontWeight:600}}>{st.station_name}</h3><p style={{fontSize:12,color:'var(--text2)'}}>{st.district} | {st.total_firs} FIRs</p></div>
        <span className={`badge badge-${(st.risk_level||'medium').toLowerCase()}`}>{(st.risk_level||'MEDIUM').toUpperCase()}</span>
      </div>
      {st.crime_breakdown&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(100px,1fr))',gap:8,marginBottom:14}}>
        {Object.entries(st.crime_breakdown).map(([type,count])=><div key={type} style={{padding:8,borderRadius:8,background:'var(--bg2)',textAlign:'center'}}>
          <p style={{fontSize:10,color:'var(--text2)',textTransform:'capitalize'}}>{type.replace('_',' ')}</p>
          <p style={{fontWeight:700,color:'var(--blue)',fontSize:16}}>{count}</p>
        </div>)}
      </div>}
      {st.monthly_trend&&Object.keys(st.monthly_trend).length>0&&<ResponsiveContainer width="100%" height={100}>
        <AreaChart data={Object.entries(st.monthly_trend).map(([m,v])=>({month:m,count:v}))}><XAxis dataKey="month" stroke="#8b9dc3" tick={{fontSize:9}}/><YAxis stroke="#8b9dc3" tick={{fontSize:9}} width={25}/>
          <Area type="monotone" dataKey="count" stroke="#4f8ff7" fill="rgba(79,143,247,.15)" strokeWidth={1.5}/>
        </AreaChart>
      </ResponsiveContainer>}
      {st.hotspot_areas?.length>0&&<p style={{marginTop:8,fontSize:12,color:'var(--text2)'}}>Hotspot Areas: <span style={{color:'var(--amber)'}}>{st.hotspot_areas.join(', ')}</span></p>}
      {st.assessment&&<p style={{marginTop:6,fontSize:12,color:'var(--text2)',padding:8,borderRadius:6,background:'var(--bg2)'}}>{st.assessment}</p>}
    </div>)}
  </div>;
}

// ── NETWORK VIEW ──
function NetworkView(){
  const [networks,setNetworks]=useState([]);
  useEffect(()=>{api('/networks').then(d=>d&&setNetworks(d));},[]);
  if(!networks.length) return <Loading/>;
  const netColors=['#4f8ff7','#f43f5e','#10b981','#f59e0b','#a78bfa'];
  return <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:20}}>
    <div><h2 style={{fontSize:20,fontWeight:700}}>Crime Network Intelligence</h2>
      <p style={{fontSize:13,color:'var(--text2)',marginTop:4}}>Cross-FIR correlation identified {networks.length} organized crime networks across UP</p></div>
    {networks.map((net,i)=>{
      const c=netColors[i%netColors.length];const members=net.key_members||[];
      return <div key={i} className="glass p-5 glow" style={{borderColor:c+'30'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <h3 style={{fontSize:18,fontWeight:700,color:c}}>{net.name}</h3>
          <span style={{padding:'4px 14px',borderRadius:20,fontSize:12,fontWeight:600,background:c+'15',color:c}}>{net.fir_count} FIRs</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:14,marginTop:16}}>
          <div style={{padding:14,borderRadius:10,background:'var(--bg2)'}}>
            <p style={{fontSize:11,color:'var(--text2)',marginBottom:6}}>Linked FIRs</p>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{(net.fir_numbers||[]).map((f,j)=><span key={j} style={{padding:'3px 8px',borderRadius:8,fontSize:11,fontFamily:'monospace',background:c+'12',color:c}}>{f}</span>)}</div>
          </div>
          <div style={{padding:14,borderRadius:10,background:'var(--bg2)'}}>
            <p style={{fontSize:11,color:'var(--text2)',marginBottom:6}}>Districts & Crime Types</p>
            <p style={{fontSize:13}}>{(net.districts||[]).join(', ')}</p>
            <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:6}}>{(net.crime_types||[]).map((ct,j)=><span key={j} style={{padding:'2px 8px',borderRadius:8,fontSize:10,background:'var(--card2)',color:'var(--text2)'}}>{ct}</span>)}</div>
          </div>
          <div style={{padding:14,borderRadius:10,background:'var(--bg2)'}}>
            <p style={{fontSize:11,color:'var(--text2)',marginBottom:6}}>Period: {net.active_period?.start} → {net.active_period?.end}</p>
            {members.length>0&&<><p style={{fontSize:11,color:'var(--text2)',marginBottom:4}}>Key Members</p>
              {members.slice(0,5).map((m,j)=><p key={j} style={{fontSize:13,color:'var(--red)'}}>{typeof m==='string'?m:m.name}</p>)}</>}
          </div>
        </div>
        {net.intelligence_brief&&<p style={{marginTop:12,fontSize:13,padding:12,borderRadius:8,background:'var(--bg2)',color:'var(--text2)',borderLeft:`3px solid ${c}`}}>{net.intelligence_brief}</p>}
        {/* Network Graph SVG */}
        <div style={{marginTop:16,borderRadius:10,background:'var(--bg)',padding:16}}>
          {(()=>{
            const firs=net.fir_numbers||[];
            const shown=firs.slice(0,10);
            const extra=firs.length-shown.length;
            const cx=300,cy=110,orbX=130,orbY=85;
            return <svg width="100%" height="240" viewBox="0 0 600 240">
              <defs><filter id={`glow-${i}`}><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
              {shown.map((fir,j)=>{
                const angle=(j/shown.length)*Math.PI*2-Math.PI/2;
                const x=cx+Math.cos(angle)*orbX;const y=cy+Math.sin(angle)*orbY;
                return <g key={j}><line x1={cx} y1={cy} x2={x} y2={y} stroke={c+'40'} strokeWidth="1.5" strokeDasharray="5 3"/>
                  <circle cx={x} cy={y} r="22" fill="var(--card)" stroke={c+'70'} strokeWidth="1.5"/>
                  <text x={x} y={y+4} textAnchor="middle" fill="var(--text)" fontSize="9" fontWeight="500">{fir.split('/').slice(-2).join('/')}</text></g>;
              })}
              <circle cx={cx} cy={cy} r="42" fill={c+'18'} stroke={c} strokeWidth="2.5" filter={`url(#glow-${i})`}/>
              <text x={cx} y={cy-8} textAnchor="middle" fill={c} fontSize="10" fontWeight="bold">{net.name.length>20?net.name.substring(0,18)+'...':net.name}</text>
              <text x={cx} y={cy+6} textAnchor="middle" fill="#8b9dc3" fontSize="9">{net.fir_count} FIRs</text>
              {extra>0&&<text x={cx} y={cy+18} textAnchor="middle" fill="#8b9dc370" fontSize="8">+{extra} more</text>}
            </svg>;
          })()}
        </div>
      </div>;
    })}
  </div>;
}

// ── BOB CHAT ──
function BobChat(){
  const [messages,setMessages]=useState([{role:'assistant',content:'I am Bob, your AI-powered FIR Intelligence Assistant built on IBM watsonx.ai Granite 3. I can analyze crime patterns, identify repeat offenders, track criminal networks, and generate intelligence reports.\n\nTry asking about specific criminals, crime patterns, districts, or networks.'}]);
  const [input,setInput]=useState('');const [loading,setLoading]=useState(false);
  const chatEndRef=React.useRef(null);
  const suggestions=['What are the top crime patterns?','Who are the repeat offenders?','Which districts have the highest crime rates?','Tell me about the Bablu gang','What cybercrime patterns exist?','Analyze the drug supply network'];
  React.useEffect(()=>{chatEndRef.current?.scrollIntoView({behavior:'smooth'});},[messages,loading]);
  const send=async(msg)=>{
    const m=msg||input;if(!m.trim())return;
    setMessages(p=>[...p,{role:'user',content:m}]);setInput('');setLoading(true);
    try{const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
      const d=await r.json();setMessages(p=>[...p,{role:'assistant',content:d.response||d.message||'No response'}]);
    }catch(e){setMessages(p=>[...p,{role:'assistant',content:'Error connecting to server. Please check the backend is running.'}]);}
    setLoading(false);
  };
  return <div className="fade-in" style={{display:'flex',flexDirection:'column',height:'calc(100vh - 200px)'}}>
    <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:10,marginBottom:16,paddingRight:8}}>
      {messages.map((m,i)=><div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
        <div style={{maxWidth:'70%',padding:'12px 16px',borderRadius:m.role==='user'?'16px 16px 4px 16px':'16px 16px 16px 4px',background:m.role==='user'?'var(--blue2)':'var(--card)',border:m.role==='user'?'none':`1px solid var(--border)`,boxShadow:'0 2px 8px rgba(0,0,0,.2)'}}>
          <pre style={{fontSize:13,whiteSpace:'pre-wrap',fontFamily:'inherit',margin:0,lineHeight:1.5}}>{m.content}</pre>
        </div>
      </div>)}
      {loading&&<div style={{display:'flex',justifyContent:'flex-start'}}><div style={{padding:'12px 16px',borderRadius:'16px',background:'var(--card)',border:'1px solid var(--border)'}}><div className="spinner"></div></div></div>}
      <div ref={chatEndRef}/>
    </div>
    <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
      {suggestions.map((s,i)=><button key={i} onClick={()=>send(s)} className="btn-ghost" style={{fontSize:12,padding:'6px 12px',borderRadius:20}}>{s}</button>)}
    </div>
    <div style={{display:'flex',gap:10}}>
      <input type="text" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Ask Bob about crime intelligence..." style={{flex:1}}/>
      <button onClick={()=>send()} className="btn btn-primary" style={{paddingLeft:24,paddingRight:24}}>Send</button>
    </div>
  </div>;
}

// ── REPORT ──
function ReportView(){
  const [report,setReport]=useState('');const [loading,setLoading]=useState(true);const [meta,setMeta]=useState(null);
  useEffect(()=>{api('/report').then(d=>{if(d){setReport(d.report||'');setMeta(d.metadata);} setLoading(false);});},[]);
  if(loading) return <Loading/>;
  return <div className="fade-in" style={{display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <div><h2 style={{fontSize:20,fontWeight:700}}>Intelligence Report</h2>
        <p style={{fontSize:13,color:'var(--text2)'}}>Generated by IBM watsonx.ai Granite 3</p></div>
      <button onClick={()=>{const b=new Blob([report],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='FIR-Intelligence-Report.txt';a.click();}} className="btn btn-primary">Download Report</button>
    </div>
    {meta&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10}}>
      <div className="glass" style={{padding:12,textAlign:'center'}}><p style={{fontSize:11,color:'var(--text2)'}}>FIRs Analyzed</p><p style={{fontWeight:700,fontSize:20,color:'var(--blue)'}}>{meta.total_firs}</p></div>
      <div className="glass" style={{padding:12,textAlign:'center'}}><p style={{fontSize:11,color:'var(--text2)'}}>Repeat Offenders</p><p style={{fontWeight:700,fontSize:20,color:'var(--red)'}}>{meta.repeat_offender_count}</p></div>
      <div className="glass" style={{padding:12,textAlign:'center'}}><p style={{fontSize:11,color:'var(--text2)'}}>Districts</p><p style={{fontWeight:700,fontSize:20,color:'var(--green)'}}>{meta.districts?.length||0}</p></div>
      <div className="glass" style={{padding:12,textAlign:'center'}}><p style={{fontSize:11,color:'var(--text2)'}}>Networks</p><p style={{fontWeight:700,fontSize:20,color:'var(--amber)'}}>{meta.patterns?.length||0}</p></div>
    </div>}
    <div className="glass p-5"><pre style={{whiteSpace:'pre-wrap',fontSize:13,lineHeight:1.7,fontFamily:'inherit',color:'var(--text2)'}}>{report}</pre></div>
  </div>;
}

// ── MAIN APP ──
function App(){
  const [tab,setTab]=useState('dashboard');const [dashData,setDashData]=useState(null);const [error,setError]=useState(null);
  useEffect(()=>{
    api('/dashboard').then(d=>{if(d)setDashData(d);else setError('Cannot connect to backend. Make sure the server is running on port 8000.');});
  },[]);
  const tabs=[
    {id:'dashboard',label:'Dashboard',icon:'📊'},
    {id:'firs',label:'FIR Records',icon:'📋'},
    {id:'offenders',label:'Repeat Offenders',icon:'🔁'},
    {id:'trends',label:'Crime Trends',icon:'📈'},
    {id:'stations',label:'Station Analysis',icon:'🏛'},
    {id:'networks',label:'Crime Networks',icon:'🕸'},
    {id:'chat',label:'Bob AI Chat',icon:'🤖'},
    {id:'report',label:'Intel Report',icon:'📄'},
  ];
  if(error) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:40}}>
    <div className="glass p-5 glow" style={{maxWidth:500,textAlign:'center'}}>
      <p style={{fontSize:48,marginBottom:16}}>⚠</p>
      <h2 style={{fontSize:20,fontWeight:700,marginBottom:8}}>Connection Error</h2>
      <p style={{color:'var(--text2)'}}>{error}</p>
      <button onClick={()=>window.location.reload()} className="btn btn-primary" style={{marginTop:20}}>Retry</button>
    </div>
  </div>;
  return <div style={{minHeight:'100vh'}}>
    <header style={{background:'var(--bg2)',borderBottom:'1px solid var(--border)',position:'sticky',top:0,zIndex:50,backdropFilter:'blur(12px)'}}>
      <div style={{maxWidth:1280,margin:'0 auto',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <div style={{width:44,height:44,borderRadius:10,background:'linear-gradient(135deg,#2563eb,#4f8ff7)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,fontWeight:800,color:'white',boxShadow:'0 4px 12px rgba(37,99,235,.4)'}}>FI</div>
          <div><h1 style={{fontSize:18,fontWeight:700}}>FIR Intelligence System</h1>
            <p style={{fontSize:11,color:'var(--text2)'}}>Powered by IBM watsonx.ai Granite 3 | NLP + Pattern Detection</p></div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:16}}>
          <span style={{padding:'4px 12px',borderRadius:20,fontSize:11,fontWeight:600,background:'rgba(16,185,129,.12)',color:'var(--green)',border:'1px solid rgba(16,185,129,.25)'}}>● LIVE</span>
          <span style={{fontSize:12,color:'var(--text2)'}}>IBM Bob AI Hackathon @ NFSU</span>
        </div>
      </div>
    </header>
    <nav style={{maxWidth:1280,margin:'0 auto',padding:'12px 20px'}}>
      <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:4}}>
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`tab ${tab===t.id?'tab-active':'tab-inactive'}`}>
          <span style={{marginRight:6}}>{t.icon}</span>{t.label}
        </button>)}
      </div>
    </nav>
    <main style={{maxWidth:1280,margin:'0 auto',padding:'0 20px 40px'}}>
      {tab==='dashboard'&&<Dashboard data={dashData}/>}
      {tab==='firs'&&<FIRList/>}
      {tab==='offenders'&&<RepeatOffenders/>}
      {tab==='trends'&&<CrimeTrends data={dashData}/>}
      {tab==='stations'&&<StationSummary/>}
      {tab==='networks'&&<NetworkView/>}
      {tab==='chat'&&<BobChat/>}
      {tab==='report'&&<ReportView/>}
    </main>
    <footer style={{borderTop:'1px solid var(--border)',padding:'16px 20px',textAlign:'center',fontSize:11,color:'var(--text2)'}}>
      Team CrimeIntel AI | IBM Bob AI Hackathon @ NFSU | Track 4: AI & Predictive Analytics | Built with FastAPI + React + Recharts + IBM watsonx.ai Granite 3
    </footer>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
