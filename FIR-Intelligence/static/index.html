<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="dark light"/>
<title>FIR Intelligence &amp; Crime Pattern Detector</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232563eb'/><text x='32' y='44' font-family='system-ui,sans-serif' font-size='32' font-weight='700' fill='white' text-anchor='middle'>FI</text></svg>"/>
<!-- Vendored locally so the dashboard works on an isolated network with no
     CDN access, and precompiled (static/app.js) so the browser never has to
     download or run Babel. Rebuild both with ./scripts/build-ui.sh.
     document.write keeps a synchronous CDN fallback if a vendor file is
     missing, which preserves script execution order. -->
<script src="vendor/react.min.js"></script>
<script>window.React||document.write('<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"><\/script>');</script>
<script src="vendor/react-dom.min.js"></script>
<script>window.ReactDOM||document.write('<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"><\/script>');</script>
<script src="vendor/prop-types.min.js"></script>
<script src="vendor/react-is.min.js"></script>
<script src="vendor/recharts.min.js"></script>
<script>window.Recharts||document.write('<script src="https://cdn.jsdelivr.net/npm/recharts@2.15.3/umd/Recharts.js"><\/script>');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--bg2:#0f1629;--card:#151d35;--card2:#1c2748;--border:#243058;
  --text:#edf2ff;--text2:#9dafd4;--text3:#7387b0;
  --blue:#5b9bff;--blue2:#2563eb;--red:#fb5a75;--green:#1fc08f;--amber:#f7a53b;
  --purple:#b49bff;--cyan:#3cddf0;--pink:#f887c4;--orange:#fd9c52;
  --focus:#8ab8ff;--radius:12px;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;line-height:1.5}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#31407a}

/* Visible keyboard focus everywhere — the previous build removed outlines
   entirely, making the dashboard unusable without a mouse. */
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:-999px;top:8px;z-index:100;background:var(--blue2);color:#fff;padding:10px 16px;border-radius:8px}
.skip-link:focus{left:8px}

.glass{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s,box-shadow .2s}
.glass:hover{border-color:rgba(91,155,255,.3)}
.glow{box-shadow:0 4px 24px rgba(0,0,0,.3)}
.fade-in{animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Respect users who ask the OS to reduce motion. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .spinner{border-top-color:var(--blue);animation:none}
}

.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.badge-critical{background:rgba(251,90,117,.18);color:#ff8497;border:1px solid rgba(251,90,117,.4)}
.badge-high{background:rgba(253,156,82,.18);color:#ffb075;border:1px solid rgba(253,156,82,.4)}
.badge-medium{background:rgba(247,165,59,.16);color:#f7c168;border:1px solid rgba(247,165,59,.35)}
.badge-low{background:rgba(31,192,143,.16);color:#4fd9ae;border:1px solid rgba(31,192,143,.35)}

.btn{padding:9px 18px;border-radius:8px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,border-color .2s;font-family:inherit}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--blue2);color:#fff}
.btn-primary:hover:not(:disabled){background:#3b82f6}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--card2);color:var(--text)}

input,select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit;transition:border-color .2s;max-width:100%}
input:focus,select:focus{border-color:var(--blue)}
label{font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:4px}

.tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:background .2s,color .2s;white-space:nowrap;font-family:inherit;background:transparent;color:var(--text2)}
.tab:hover{background:var(--card2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--blue2);color:#fff}

.p-5{padding:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.shell{width:100%;max-width:1320px;margin:0 auto;padding:0 20px}
.chip{padding:3px 10px;border-radius:12px;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.chip-btn{border:1px solid rgba(91,155,255,.25);background:rgba(91,155,255,.1);color:var(--blue);cursor:pointer;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.chip-btn:hover{background:rgba(91,155,255,.22)}
.row-card{padding:16px;cursor:pointer;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:inherit;font:inherit}
.row-card:hover{border-color:rgba(91,155,255,.35)}
.muted{color:var(--text2);font-size:13px}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Floating assistant */
.chat-fab{position:fixed;right:22px;bottom:22px;z-index:80;width:58px;height:58px;border-radius:50%;
  border:none;cursor:pointer;color:#fff;background:linear-gradient(135deg,#2563eb,#5b9bff);
  box-shadow:0 8px 26px rgba(37,99,235,.45);display:flex;align-items:center;justify-content:center;
  transition:transform .18s,box-shadow .18s}
.chat-fab:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(37,99,235,.55)}
.fab-dot{position:absolute;top:11px;right:11px;width:11px;height:11px;border-radius:50%;
  background:var(--red);border:2px solid var(--bg2);animation:fabPulse 1.8s ease-in-out infinite}
@keyframes fabPulse{0%,100%{opacity:1}50%{opacity:.45}}
.chat-dock{position:fixed;right:22px;bottom:92px;z-index:79;width:400px;height:min(620px,calc(100vh - 140px));
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.5)}
/* Blinking cursor while a reply streams in. */
.caret{animation:caret 1s steps(2) infinite;color:var(--blue);margin-left:1px}
@keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}
@media (max-width:620px){
  .chat-dock{right:0;left:0;bottom:0;width:100%;height:88vh;border-radius:16px 16px 0 0;
    padding-bottom:env(safe-area-inset-bottom,0)}
  .chat-fab{right:16px;bottom:16px;width:52px;height:52px}
  /* Full-width panel puts its composer exactly where the launcher sits, so the
     launcher would intercept clicks on Send. The panel has its own close
     button, so hide the launcher while it is open. */
  .chat-dock ~ .chat-fab{display:none}
}
@media (prefers-reduced-motion:reduce){
  .caret,.fab-dot{animation:none}
}

/* The old build had no media queries at all: the two-column chart rows and
   the 70%-wide chat bubbles were unusable below ~700px. */
@media (max-width:900px){
  .grid-2{grid-template-columns:1fr}
  .shell{padding:0 16px}
}
@media (max-width:620px){
  .toolbar > *{flex:1 1 100%}
  .stat-grid{grid-template-columns:1fr 1fr}
  .chat-bubble{max-width:92%!important}
  .header-sub,.header-stats{display:none}
  header h1{font-size:15px}
}
@media print{
  body{background:#fff;color:#000}
  nav,.no-print{display:none!important}
  .glass{border:1px solid #ccc;background:#fff}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="root"></div>
<noscript><p style="padding:40px;text-align:center">This dashboard requires JavaScript.</p></noscript>
<script>
// Surface a clear message when the CDN bundles are blocked (offline or a
// restricted police network) instead of rendering a permanently blank page.
window.__depsReady = ['React','ReactDOM','Recharts'].every(function(g){return window[g];});
if(!window.__depsReady){
  document.getElementById('root').innerHTML =
    '<div style="max-width:560px;margin:80px auto;padding:24px;border:1px solid #243058;border-radius:12px;background:#151d35">'+
    '<h1 style="font-size:20px;margin-bottom:10px">Dashboard assets could not load</h1>'+
    '<p style="color:#9dafd4;font-size:14px;line-height:1.6">React and Recharts could not be loaded from '+
    '<code style="color:#5b9bff">static/vendor/</code> or the CDN fallback, so the dashboard cannot start. '+
    'Run <code style="color:#5b9bff">./scripts/build-ui.sh</code> to repopulate the vendored assets.</p>'+
    '<p style="color:#9dafd4;font-size:14px;margin-top:12px">The API is unaffected — try '+
    '<code style="color:#5b9bff">/api/health</code>, <code style="color:#5b9bff">/api/dashboard</code> or the '+
    '<a href="/docs" style="color:#5b9bff">OpenAPI docs</a>.</p></div>';
}
</script>
<script src="app.js"></script>
</body>
</html>
