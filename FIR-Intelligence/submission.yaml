submission:
  title: "FIR Intelligence & Crime Pattern Detector"
  problem_statement: >
    India's CCTNS system holds 3+ crore digitized FIRs with no NLP layer.
    Serial offenders evade detection because inter-district FIR connections
    are never surfaced, and pattern analysis remains entirely manual.
    Police officers lack automated tools to identify repeat offenders,
    cross-reference modus operandi across jurisdictions, or detect
    organized crime networks spanning multiple districts.
  solution_summary: >
    A Bob-powered NLP intelligence platform that ingests FIR text batches,
    automatically classifies crime types using IBM watsonx.ai Granite models,
    extracts named entities (accused, victims, locations, modus operandi)
    through hybrid NLP (LLM + regex-based extraction), detects repeat offenders
    via fuzzy name matching and MO fingerprinting, identifies organized crime
    networks through cross-FIR correlation, and generates station-level crime
    trend summaries with actionable intelligence reports. The system exposes
    both a web dashboard for visual analysis and an MCP server for direct
    IBM Bob CLI integration.
  key_features:
    - "Automated crime type classification using IBM watsonx.ai Granite models with rule-based fallback"
    - "Hybrid NER pipeline extracting accused persons, victims, locations, weapons, vehicles, IPC sections, and MO patterns"
    - "Cross-FIR repeat offender detection using fuzzy name matching (RapidFuzz) and alias resolution"
    - "Organized crime network identification through MO fingerprinting and entity correlation across districts"
    - "Station-level crime trend analysis with temporal patterns, hotspot detection, and risk assessment"
    - "Interactive web dashboard with real-time charts, network graphs, and intelligence reports"
    - "MCP server for genuine IBM Bob CLI integration — query FIR intelligence through natural language"
    - "Downloadable intelligence reports with executive summary, pattern analysis, and recommended actions"
  tech_stack:
    - "IBM watsonx.ai (Granite 3 8B Instruct) — crime classification, entity extraction, report generation"
    - "IBM Bob CLI — MCP-based conversational FIR intelligence querying"
    - "Python / FastAPI — backend API server and NLP pipeline"
    - "React / Vite / Tailwind CSS — interactive dashboard frontend"
    - "RapidFuzz — fuzzy string matching for repeat offender detection"
    - "Recharts — crime trend and distribution visualizations"
    - "MCP Protocol — server for Bob CLI tool integration"
  bob_usage: >
    IBM Bob is the primary intelligence interface. The MCP server exposes
    6 tools (analyze_firs, get_repeat_offenders, get_station_summary,
    get_crime_networks, search_firs, generate_intelligence_report) that
    Bob calls via the Model Context Protocol. Bob's Granite backbone powers
    crime classification, entity extraction, and natural language report
    generation. The web dashboard's chat interface also routes through
    Bob's watsonx.ai integration for conversational FIR querying.
  known_limitations:
    - "Entity extraction accuracy varies with non-standard FIR text formats"
    - "Repeat offender matching is name-based — biometric/photo matching not implemented"
    - "Analysis is batch-mode, not real-time streaming from CCTNS"
    - "Geographic hotspot mapping uses district centroids, not precise coordinates"
    - "The watsonx.ai API falls back to rule-based processing if credentials are not configured"
