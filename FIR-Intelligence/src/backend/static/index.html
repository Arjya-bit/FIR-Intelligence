<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FIR Intelligence &amp; Crime Pattern Detector</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2/umd/Recharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@3/dist/tailwind.min.css" rel="stylesheet"/>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#334155;--text:#f8fafc;--text2:#94a3b8;--blue:#3b82f6;--red:#ef4444;--green:#22c55e;--amber:#f59e0b;--purple:#8b5cf6;--cyan:#06b6d4;--pink:#ec4899}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
.glass{background:rgba(30,41,59,.85);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.12);border-radius:.75rem}
.glow{box-shadow:0 0 20px rgba(59,130,246,.15)}
.tab-active{background:var(--blue);color:white}
.tab-inactive{background:transparent;color:var(--text2)}
.tab-inactive:hover{background:rgba(59,130,246,.15);color:var(--text)}
.badge-critical{background:#dc2626;color:white}
.badge-high{background:#f97316;color:white}
.badge-medium{background:#eab308;color:#1e293b}
.badge-low{background:#22c55e;color:white}
.fade-in{animation:fadeIn .3s ease-in}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spinner{width:24px;height:24px;border:3px solid var(--card2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--card2);border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useCallback} = React;
const {PieChart, Pie, Cell, BarChart, Bar, LineChart, Line, AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer} = Recharts;

const API = '/api';
const COLORS = ['#3b82f6','#ef4444','#22c55e','#f59e0b','#8b5cf6','#06b6d4','#ec4899','#f97316','#14b8a6','#6366f1','#a855f7','#e11d48','#84cc16','#0ea5e9','#d946ef'];
const RISK_COLORS = {CRITICAL:'#dc2626',HIGH:'#f97316',MEDIUM:'#eab308',LOW:'#22c55e'};

async function api(path){const r=await fetch(API+path);return r.json();}

// ── Stat Card ──
function StatCard({label, value, icon, color}){
  return (
    <div className="glass p-5 glow fade-in">
      <div className="flex justify-between items-start">
        <div>
          <p className="text-sm" style={{color:'var(--text2)'}}>{label}</p>
          <p className="text-3xl font-bold mt-1" style={{color}}>{value}</p>
        </div>
        <span className="text-2xl opacity-60">{icon}</span>
      </div>
    </div>
  );
}

// ── Dashboard Tab ──
function Dashboard({data}){
  if(!data) return <Loading/>;
  const crimeData = Object.entries(data.crime_breakdown||{}).map(([name,value])=>({name,value}));
  const districtData = Object.entries(data.district_breakdown||{}).map(([name,value])=>({name,value}));
  const trendData = Object.entries(data.monthly_trend||{}).map(([name,value])=>({name,value}));
  return (
    <div className="fade-in space-y-6">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard label="Total FIRs" value={data.total_firs} icon="📋" color="var(--blue)"/>
        <StatCard label="Accused Identified" value={data.total_accused} icon="👤" color="var(--red)"/>
        <StatCard label="Victims" value={data.total_victims} icon="🛡️" color="var(--amber)"/>
        <StatCard label="Repeat Offenders" value={data.repeat_offenders_count} icon="🔁" color="var(--purple)"/>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div className="glass p-5">
          <h3 className="text-lg font-semibold mb-4">Crime Type Distribution</h3>
          <ResponsiveContainer width="100%" height={280}>
            <PieChart>
              <Pie data={crimeData} dataKey="value" nameKey="name" cx="50%" cy="50%" outerRadius={100} label={({name,percent})=>`${name} ${(percent*100).toFixed(0)}%`}>
                {crimeData.map((e,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}
              </Pie>
              <Tooltip contentStyle={{background:'#1e293b',border:'1px solid #334155',borderRadius:'8px',color:'#f8fafc'}}/>
            </PieChart>
          </ResponsiveContainer>
        </div>
        <div className="glass p-5">
          <h3 className="text-lg font-semibold mb-4">FIRs by District</h3>
          <ResponsiveContainer width="100%" height={280}>
            <BarChart data={districtData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
              <XAxis dataKey="name" stroke="#94a3b8" tick={{fontSize:12}}/>
              <YAxis stroke="#94a3b8"/>
              <Tooltip contentStyle={{background:'#1e293b',border:'1px solid #334155',borderRadius:'8px',color:'#f8fafc'}}/>
              <Bar dataKey="value" fill="#3b82f6" radius={[4,4,0,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
      <div className="glass p-5">
        <h3 className="text-lg font-semibold mb-4">Monthly Crime Trend</h3>
        <ResponsiveContainer width="100%" height={250}>
          <LineChart data={trendData}>
            <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
            <XAxis dataKey="name" stroke="#94a3b8" tick={{fontSize:12}}/>
            <YAxis stroke="#94a3b8"/>
            <Tooltip contentStyle={{background:'#1e293b',border:'1px solid #334155',borderRadius:'8px',color:'#f8fafc'}}/>
            <Line type="monotone" dataKey="value" stroke="#3b82f6" strokeWidth={2} dot={{fill:'#3b82f6'}}/>
          </LineChart>
        </ResponsiveContainer>
      </div>
      <div className="glass p-5">
        <h3 className="text-lg font-semibold mb-4">Crime Networks Detected</h3>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {(data.crime_networks||[]).map((net,i)=>(
            <div key={i} className="p-4 rounded-lg" style={{background:'rgba(59,130,246,.1)',border:'1px solid rgba(59,130,246,.3)'}}>
              <h4 className="font-semibold text-blue-400">{net.name}</h4>
              <p className="text-sm mt-1" style={{color:'var(--text2)'}}>{net.fir_count} linked FIRs • {net.districts.join(', ')}</p>
              <div className="flex flex-wrap gap-1 mt-2">
                {net.crime_types.map((ct,j)=><span key={j} className="px-2 py-0.5 rounded text-xs bg-blue-900 text-blue-300">{ct}</span>)}
              </div>
            </div>
          ))}
        </div>
      </div>
      <div className="glass p-5">
        <h3 className="text-lg font-semibold mb-4">Severity Distribution</h3>
        <div className="grid grid-cols-4 gap-4">
          {Object.entries(data.severity_distribution||{}).map(([level,count])=>(
            <div key={level} className="text-center p-3 rounded-lg" style={{background: level==='critical'?'rgba(220,38,38,.15)':level==='high'?'rgba(249,115,22,.15)':level==='medium'?'rgba(234,179,8,.15)':'rgba(34,197,94,.15)'}}>
              <p className="text-2xl font-bold" style={{color: RISK_COLORS[level.toUpperCase()]||'#94a3b8'}}>{count}</p>
              <p className="text-xs mt-1 uppercase" style={{color:'var(--text2)'}}>{level}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── FIR List Tab ──
function FIRList(){
  const [firs, setFirs] = useState([]);
  const [filter, setFilter] = useState('');
  const [expanded, setExpanded] = useState(null);
  useEffect(()=>{api('/firs').then(d=>setFirs(d));},[]);
  const filtered = firs.filter(f=> !filter || f.crime_type===filter || f.fir_number.toLowerCase().includes(filter.toLowerCase()) || (f.entities?.accused||[]).some(a=>a.name.toLowerCase().includes(filter.toLowerCase())));
  const crimeTypes = [...new Set(firs.map(f=>f.crime_type))].sort();
  return (
    <div className="fade-in space-y-4">
      <div className="flex gap-3 flex-wrap">
        <input type="text" placeholder="Search FIR #, accused name..." className="px-4 py-2 rounded-lg bg-gray-800 border border-gray-600 text-white flex-1 min-w-64" value={filter} onChange={e=>setFilter(e.target.value)}/>
        <select className="px-4 py-2 rounded-lg bg-gray-800 border border-gray-600 text-white" value={filter} onChange={e=>setFilter(e.target.value)}>
          <option value="">All Types</option>
          {crimeTypes.map(ct=><option key={ct} value={ct}>{ct}</option>)}
        </select>
      </div>
      <p className="text-sm" style={{color:'var(--text2)'}}>{filtered.length} records</p>
      {filtered.map(fir=>(
        <div key={fir.fir_number} className="glass p-4 cursor-pointer hover:border-blue-500 transition-colors" onClick={()=>setExpanded(expanded===fir.fir_number?null:fir.fir_number)}>
          <div className="flex justify-between items-center">
            <div>
              <span className="font-mono text-blue-400 font-semibold">{fir.fir_number}</span>
              <span className={`ml-3 px-2 py-0.5 rounded text-xs badge-${fir.severity||'medium'}`}>{(fir.severity||'medium').toUpperCase()}</span>
              <span className="ml-2 px-2 py-0.5 rounded text-xs bg-gray-700 text-gray-300">{fir.crime_type}</span>
            </div>
            <div className="text-sm" style={{color:'var(--text2)'}}>{fir.date} • {fir.district}</div>
          </div>
          <p className="mt-2 text-sm line-clamp-2" style={{color:'var(--text2)'}}>{fir.text?.substring(0,200)}...</p>
          {expanded===fir.fir_number && fir.entities && (
            <div className="mt-4 pt-4 border-t border-gray-700 grid grid-cols-1 md:grid-cols-2 gap-4 fade-in">
              <div>
                <h4 className="text-sm font-semibold text-red-400 mb-2">Accused ({(fir.entities.accused||[]).length})</h4>
                {(fir.entities.accused||[]).map((a,i)=>(
                  <div key={i} className="mb-2 text-sm p-2 rounded bg-gray-800">
                    <p className="font-medium">{a.name}</p>
                    {a.aliases?.length>0 && <p className="text-xs text-gray-400">AKA: {a.aliases.join(', ')}</p>}
                    {a.age && <p className="text-xs text-gray-400">Age: {a.age} • {a.gender||'Unknown'}</p>}
                    {a.address && <p className="text-xs text-gray-400">{a.address}</p>}
                  </div>
                ))}
              </div>
              <div>
                <h4 className="text-sm font-semibold text-green-400 mb-2">Victims ({(fir.entities.victims||[]).length})</h4>
                {(fir.entities.victims||[]).map((v,i)=>(
                  <div key={i} className="mb-2 text-sm p-2 rounded bg-gray-800">
                    <p className="font-medium">{v.name}</p>
                    {v.age && <p className="text-xs text-gray-400">Age: {v.age} • {v.occupation||''}</p>}
                  </div>
                ))}
                {fir.entities.modus_operandi && (
                  <div className="mt-3">
                    <h4 className="text-sm font-semibold text-amber-400 mb-1">Modus Operandi</h4>
                    <p className="text-sm text-gray-400">{typeof fir.entities.modus_operandi === 'object' ? (fir.entities.modus_operandi.summary || fir.entities.modus_operandi.method || JSON.stringify(fir.entities.modus_operandi)) : fir.entities.modus_operandi}</p>
                  </div>
                )}
              </div>
              {fir.entities.location && (
                <div>
                  <h4 className="text-sm font-semibold text-cyan-400 mb-1">Location</h4>
                  <p className="text-sm text-gray-400">{typeof fir.entities.location === 'object' ? `${fir.entities.location.district||''} - ${fir.entities.location.area||''} (PS: ${fir.entities.location.police_station||''})` : fir.entities.location}</p>
                </div>
              )}
              {fir.entities.ipc_sections?.length>0 && (
                <div>
                  <h4 className="text-sm font-semibold text-purple-400 mb-1">IPC Sections</h4>
                  <div className="flex flex-wrap gap-1">{fir.entities.ipc_sections.map((s,i)=><span key={i} className="px-2 py-0.5 rounded text-xs bg-purple-900 text-purple-300">{s}</span>)}</div>
                </div>
              )}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ── Repeat Offenders Tab ──
function RepeatOffenders(){
  const [offenders, setOffenders] = useState([]);
  useEffect(()=>{api('/repeat-offenders').then(d=>setOffenders(d));},[]);
  return (
    <div className="fade-in space-y-4">
      <h2 className="text-xl font-bold">Flagged Repeat Offenders</h2>
      <p className="text-sm" style={{color:'var(--text2)'}}>Cross-FIR pattern matching identified {offenders.length} repeat offenders using fuzzy name matching (RapidFuzz threshold 78%)</p>
      {offenders.length===0 && <div className="glass p-8 text-center"><p style={{color:'var(--text2)'}}>No repeat offenders detected in current dataset</p></div>}
      {offenders.map((off,i)=>(
        <div key={i} className="glass p-5 glow">
          <div className="flex justify-between items-start">
            <div>
              <h3 className="text-lg font-bold text-red-400">{off.primary_name}</h3>
              {off.aliases?.length>0 && <p className="text-sm text-gray-400 mt-1">Aliases: {off.aliases.join(', ')}</p>}
            </div>
            <span className={`px-3 py-1 rounded-full text-sm font-semibold badge-${(off.risk_level||'medium').toLowerCase()}`}>{(off.risk_level||'MEDIUM').toUpperCase()}</span>
          </div>
          <div className="mt-3 grid grid-cols-2 md:grid-cols-4 gap-3">
            <div className="p-2 rounded bg-gray-800"><p className="text-xs text-gray-400">Linked FIRs</p><p className="font-semibold">{off.fir_count || off.linked_firs?.length || 0}</p></div>
            <div className="p-2 rounded bg-gray-800"><p className="text-xs text-gray-400">Crime Types</p><p className="font-semibold text-sm">{(off.crime_types||[]).join(', ')}</p></div>
            <div className="p-2 rounded bg-gray-800"><p className="text-xs text-gray-400">Districts</p><p className="font-semibold text-sm">{(off.districts||[]).join(', ')}</p></div>
            <div className="p-2 rounded bg-gray-800"><p className="text-xs text-gray-400">Confidence</p><p className="font-semibold">{off.match_confidence ? `${(off.match_confidence*100).toFixed(0)}%` : 'N/A'}</p></div>
          </div>
          {off.linked_firs && (
            <div className="mt-3">
              <p className="text-xs text-gray-400 mb-1">Linked FIR Numbers</p>
              <div className="flex flex-wrap gap-1">{off.linked_firs.map((f,j)=><span key={j} className="px-2 py-0.5 rounded text-xs bg-blue-900 text-blue-300 font-mono">{f}</span>)}</div>
            </div>
          )}
          {off.mo_signature && <p className="mt-2 text-sm text-gray-400"><strong className="text-amber-400">MO Signature:</strong> {off.mo_signature}</p>}
          {off.intelligence_assessment && <p className="mt-1 text-sm text-gray-400"><strong className="text-cyan-400">Assessment:</strong> {off.intelligence_assessment}</p>}
        </div>
      ))}
    </div>
  );
}

// ── Crime Trends Tab ──
function CrimeTrends({data}){
  if(!data) return <Loading/>;
  const trendData = Object.entries(data.monthly_trend||{}).map(([name,value])=>({name,value}));
  const crimeRanking = Object.entries(data.crime_breakdown||{}).sort((a,b)=>b[1]-a[1]);
  const maxCrime = crimeRanking.length>0 ? crimeRanking[0][1] : 1;
  return (
    <div className="fade-in space-y-6">
      <div className="glass p-5">
        <h3 className="text-lg font-semibold mb-4">Crime Trend Over Time</h3>
        <ResponsiveContainer width="100%" height={300}>
          <AreaChart data={trendData}>
            <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
            <XAxis dataKey="name" stroke="#94a3b8"/>
            <YAxis stroke="#94a3b8"/>
            <Tooltip contentStyle={{background:'#1e293b',border:'1px solid #334155',borderRadius:'8px',color:'#f8fafc'}}/>
            <Area type="monotone" dataKey="value" stroke="#3b82f6" fill="rgba(59,130,246,.3)" strokeWidth={2}/>
          </AreaChart>
        </ResponsiveContainer>
      </div>
      <div className="glass p-5">
        <h3 className="text-lg font-semibold mb-4">Crime Type Ranking</h3>
        <div className="space-y-3">
          {crimeRanking.map(([type,count],i)=>(
            <div key={type} className="flex items-center gap-3">
              <span className="w-6 text-center text-sm font-bold" style={{color:COLORS[i%COLORS.length]}}>#{i+1}</span>
              <span className="w-32 text-sm capitalize">{type.replace('_',' ')}</span>
              <div className="flex-1 bg-gray-800 rounded-full h-6 overflow-hidden">
                <div className="h-full rounded-full flex items-center pl-2 text-xs font-semibold text-white transition-all" style={{width:`${(count/maxCrime)*100}%`,background:COLORS[i%COLORS.length]}}>{count}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div className="glass p-5">
        <h3 className="text-lg font-semibold mb-4">District-wise Crime Distribution</h3>
        <ResponsiveContainer width="100%" height={300}>
          <BarChart data={Object.entries(data.district_breakdown||{}).map(([name,value])=>({name,value}))}>
            <CartesianGrid strokeDasharray="3 3" stroke="#334155"/>
            <XAxis dataKey="name" stroke="#94a3b8"/>
            <YAxis stroke="#94a3b8"/>
            <Tooltip contentStyle={{background:'#1e293b',border:'1px solid #334155',borderRadius:'8px',color:'#f8fafc'}}/>
            <Bar dataKey="value" radius={[4,4,0,0]}>
              {Object.entries(data.district_breakdown||{}).map((_,i)=><Cell key={i} fill={COLORS[i%COLORS.length]}/>)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

// ── Station Summary Tab ──
function StationSummary(){
  const [stations, setStations] = useState([]);
  useEffect(()=>{api('/stations').then(d=>setStations(d));},[]);
  return (
    <div className="fade-in space-y-4">
      <h2 className="text-xl font-bold">Station-Level Analysis</h2>
      {stations.map((st,i)=>(
        <div key={i} className="glass p-5">
          <div className="flex justify-between items-start mb-3">
            <div>
              <h3 className="text-lg font-semibold">{st.station_name || st.district}</h3>
              <p className="text-sm text-gray-400">{st.total_firs} FIRs recorded</p>
            </div>
            <span className={`px-3 py-1 rounded-full text-sm font-semibold badge-${(st.risk_level||'medium').toLowerCase()}`}>{(st.risk_level||'MEDIUM').toUpperCase()}</span>
          </div>
          {st.crime_breakdown && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
              {Object.entries(st.crime_breakdown).map(([type,count])=>(
                <div key={type} className="p-2 rounded bg-gray-800 text-center">
                  <p className="text-xs text-gray-400 capitalize">{type.replace('_',' ')}</p>
                  <p className="font-bold text-blue-400">{count}</p>
                </div>
              ))}
            </div>
          )}
          {st.monthly_trend && (
            <ResponsiveContainer width="100%" height={120}>
              <AreaChart data={Object.entries(st.monthly_trend).map(([m,v])=>({month:m,count:v}))}>
                <XAxis dataKey="month" stroke="#94a3b8" tick={{fontSize:10}}/>
                <YAxis stroke="#94a3b8" tick={{fontSize:10}}/>
                <Area type="monotone" dataKey="count" stroke="#3b82f6" fill="rgba(59,130,246,.2)" strokeWidth={1.5}/>
              </AreaChart>
            </ResponsiveContainer>
          )}
          {st.hotspot_areas?.length>0 && (
            <div className="mt-2">
              <p className="text-xs text-gray-400">Hotspot Areas: <span className="text-amber-400">{st.hotspot_areas.join(', ')}</span></p>
            </div>
          )}
          {st.assessment && <p className="mt-2 text-sm text-gray-400">{st.assessment}</p>}
        </div>
      ))}
    </div>
  );
}

// ── Network View Tab ──
function NetworkView(){
  const [networks, setNetworks] = useState([]);
  useEffect(()=>{api('/networks').then(d=>setNetworks(d));},[]);
  const netColors = ['#3b82f6','#ef4444','#22c55e','#f59e0b','#8b5cf6'];
  return (
    <div className="fade-in space-y-6">
      <h2 className="text-xl font-bold">Crime Network Intelligence</h2>
      <p className="text-sm" style={{color:'var(--text2)'}}>Cross-FIR correlation analysis identified {networks.length} organized crime networks operating across UP districts</p>
      {networks.map((net,i)=>{
        const color = netColors[i%netColors.length];
        const members = net.key_members || net.accused_names || [];
        return (
          <div key={i} className="glass p-5 glow" style={{borderColor:color+'40'}}>
            <div className="flex justify-between items-start">
              <h3 className="text-lg font-bold" style={{color}}>{net.name}</h3>
              <span className="px-3 py-1 rounded-full text-sm font-semibold" style={{background:color+'20',color}}>{net.fir_count} FIRs</span>
            </div>
            <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="p-3 rounded-lg bg-gray-800">
                <p className="text-xs text-gray-400 mb-2">Linked FIRs</p>
                <div className="flex flex-wrap gap-1">{(net.fir_numbers||[]).map((f,j)=><span key={j} className="px-2 py-0.5 rounded text-xs font-mono" style={{background:color+'20',color}}>{f}</span>)}</div>
              </div>
              <div className="p-3 rounded-lg bg-gray-800">
                <p className="text-xs text-gray-400 mb-2">Districts</p>
                <p className="text-sm">{(net.districts||[]).join(', ')}</p>
                <p className="text-xs text-gray-400 mt-2">Crime Types</p>
                <div className="flex flex-wrap gap-1 mt-1">{(net.crime_types||[]).map((ct,j)=><span key={j} className="px-2 py-0.5 rounded text-xs bg-gray-700">{ct}</span>)}</div>
              </div>
              <div className="p-3 rounded-lg bg-gray-800">
                <p className="text-xs text-gray-400 mb-2">Active Period</p>
                <p className="text-sm">{net.active_period?.start} → {net.active_period?.end}</p>
                {members.length>0 && (
                  <>
                    <p className="text-xs text-gray-400 mt-2 mb-1">Key Members</p>
                    {members.slice(0,4).map((m,j)=><p key={j} className="text-sm text-red-400">{typeof m==='string'?m:m.name}</p>)}
                  </>
                )}
              </div>
            </div>
            {net.intelligence_brief && <p className="mt-3 text-sm p-3 rounded bg-gray-800 text-gray-300 border-l-2" style={{borderColor:color}}>{net.intelligence_brief}</p>}

            {/* SVG Network Graph */}
            <div className="mt-4 rounded-lg bg-gray-900 p-4">
              <svg width="100%" height="180" viewBox="0 0 600 180">
                <circle cx="300" cy="90" r="35" fill={color+'30'} stroke={color} strokeWidth="2"/>
                <text x="300" y="87" textAnchor="middle" fill={color} fontSize="10" fontWeight="bold">{net.name.split(' ').slice(0,2).join(' ')}</text>
                <text x="300" y="100" textAnchor="middle" fill="#94a3b8" fontSize="9">{net.fir_count} FIRs</text>
                {(net.fir_numbers||[]).slice(0,6).map((fir,j)=>{
                  const angle = (j/(Math.min(net.fir_numbers.length,6)))*Math.PI*2 - Math.PI/2;
                  const x = 300 + Math.cos(angle)*130;
                  const y = 90 + Math.sin(angle)*70;
                  return (
                    <g key={j}>
                      <line x1="300" y1="90" x2={x} y2={y} stroke={color+'60'} strokeWidth="1.5" strokeDasharray="4 2"/>
                      <circle cx={x} cy={y} r="22" fill="#1e293b" stroke={color+'80'} strokeWidth="1.5"/>
                      <text x={x} y={y+3} textAnchor="middle" fill="#f8fafc" fontSize="7">{fir.split('/').pop()}</text>
                    </g>
                  );
                })}
              </svg>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Bob Chat Tab ──
function BobChat(){
  const [messages, setMessages] = useState([{role:'assistant',content:'I am Bob, your AI-powered FIR Intelligence Assistant. I can help you analyze crime patterns, identify repeat offenders, and generate intelligence reports. Ask me anything about the FIR data.'}]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const suggestions = ['What are the top crime patterns?','Who are the repeat offenders?','Which districts have the highest crime rates?','Tell me about the Bablu gang','What cybercrime patterns exist?'];
  const send = async (msg)=>{
    const m = msg || input;
    if(!m.trim()) return;
    setMessages(prev=>[...prev,{role:'user',content:m}]);
    setInput('');
    setLoading(true);
    try{
      const r = await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
      const d = await r.json();
      setMessages(prev=>[...prev,{role:'assistant',content:d.response||d.message||'No response'}]);
    }catch(e){setMessages(prev=>[...prev,{role:'assistant',content:'Error connecting to server'}]);}
    setLoading(false);
  };
  return (
    <div className="fade-in flex flex-col h-[calc(100vh-200px)]">
      <div className="flex-1 overflow-y-auto space-y-3 mb-4">
        {messages.map((m,i)=>(
          <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}>
            <div className={`max-w-lg px-4 py-3 rounded-xl ${m.role==='user'?'bg-blue-600 text-white':'glass'}`}>
              <p className="text-sm whitespace-pre-wrap">{m.content}</p>
            </div>
          </div>
        ))}
        {loading && <div className="flex justify-start"><div className="glass px-4 py-3 rounded-xl"><div className="spinner"></div></div></div>}
      </div>
      <div className="flex flex-wrap gap-2 mb-3">
        {suggestions.map((s,i)=>(
          <button key={i} onClick={()=>send(s)} className="px-3 py-1.5 rounded-full text-xs bg-gray-800 text-gray-300 hover:bg-gray-700 transition-colors">{s}</button>
        ))}
      </div>
      <div className="flex gap-2">
        <input type="text" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Ask Bob about crime intelligence..." className="flex-1 px-4 py-3 rounded-xl bg-gray-800 border border-gray-600 text-white"/>
        <button onClick={()=>send()} className="px-6 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-500 transition-colors">Send</button>
      </div>
    </div>
  );
}

// ── Report Tab ──
function ReportView(){
  const [report, setReport] = useState('');
  const [loading, setLoading] = useState(true);
  useEffect(()=>{api('/report').then(d=>{setReport(d.report||d.text||JSON.stringify(d,null,2));setLoading(false);});},[]);
  if(loading) return <Loading/>;
  return (
    <div className="fade-in space-y-4">
      <div className="flex justify-between items-center">
        <h2 className="text-xl font-bold">Intelligence Report</h2>
        <button onClick={()=>{const b=new Blob([report],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='intelligence-report.txt';a.click();}} className="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-500">Download Report</button>
      </div>
      <div className="glass p-6">
        <pre className="whitespace-pre-wrap text-sm leading-relaxed" style={{color:'var(--text2)'}}>{report}</pre>
      </div>
    </div>
  );
}

function Loading(){
  return <div className="flex justify-center items-center py-20"><div className="spinner" style={{width:'40px',height:'40px'}}></div></div>;
}

    <div className="min-h-screen">
      {/* Header */}
      <header className="glass border-0 border-b border-gray-700 sticky top-0 z-50" style={{borderRadius:0}}>
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-xl font-bold">FI</div>
            <div>
              <h1 className="text-lg font-bold">FIR Intelligence System</h1>
              <p className="text-xs" style={{color:'var(--text2)'}}>Powered by IBM watsonx.ai Granite 3</p>
            </div>
          </div>
          <div className="flex items-center gap-4">
            <span className="px-3 py-1 rounded-full text-xs bg-green-900 text-green-400">● LIVE</span>
            <span className="text-xs" style={{color:'var(--text2)'}}>IBM Bob AI Hackathon @ NFSU</span>
          </div>
        </div>
      </header>

      {/* Tab Nav */}
      <nav className="max-w-7xl mx-auto px-4 py-3">
        <div className="flex gap-1 overflow-x-auto pb-1">
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} className={`px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-all ${tab===t.id?'tab-active':'tab-inactive'}`}>
              <span className="mr-1.5">{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
      </nav>

      {/* Content */}
      <main className="max-w-7xl mx-auto px-4 pb-8">
        {tab==='dashboard' && <Dashboard data={dashData}/>}
        {tab==='firs' && <FIRList/>}
        {tab==='offenders' && <RepeatOffenders/>}
        {tab==='trends' && <CrimeTrends data={dashData}/>}
        {tab==='stations' && <StationSummary/>}
        {tab==='networks' && <NetworkView/>}
        {tab==='chat' && <BobChat/>}
        {tab==='report' && <ReportView/>}
      </main>

      {/* Footer */}
      <footer className="border-t border-gray-800 py-4 text-center text-xs" style={{color:'var(--text2)'}}>
        Team CrimeIntel AI • IBM Bob AI Hackathon @ NFSU • Track 4: AI &amp; Predictive Analytics
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
